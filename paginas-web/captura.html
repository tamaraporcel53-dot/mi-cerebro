<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Captura</title>
<style>
html,body{margin:0;height:100%;background:#FDEBF2;font-family:system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center}
.tel{width:390px;height:800px;border-radius:48px;background:#1F1714;padding:14px;box-shadow:0 30px 60px -30px rgba(162,51,95,.6)}
.tel iframe{width:100%;height:100%;border:0;border-radius:36px;background:#fff;display:block}
.compu{width:100%;height:100%}
.compu iframe{width:100%;height:100%;border:0;display:block}
</style></head>
<body>
<script>
var q=new URLSearchParams(location.search), modo=q.get("modo")||"tel", sec=q.get("sec");
var caja=document.createElement("div");caja.className=modo;
var f=document.createElement("iframe");f.src="beautyco/index.html";caja.appendChild(f);document.body.appendChild(caja);
f.addEventListener("load",function(){
  var d=f.contentDocument;d.documentElement.style.scrollBehavior="auto";
  if(sec){var el=d.getElementById(sec);f.contentWindow.scrollTo({top:el.getBoundingClientRect().top+f.contentWindow.scrollY-(modo=="tel"?110:140),behavior:"instant"})}
});
</script>
</body></html>
